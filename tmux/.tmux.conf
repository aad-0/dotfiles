# ====================================================================
# GLOBAL TERMINAL & SYSTEM ENVIRONMENT CONFIG
# ====================================================================
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ',xterm-256color:Tc'

setw -g mode-keys vi
set -g escape-time 10
set-window-option -g automatic-rename off
set -g allow-rename off
set -g history-limit 100000

# Status Bar Configuration
set -g status-left '#{window_index}: #{window_name}<#{window_flags}>'
set -g status-left-length 50
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#{=21:pane_title}-#(exec basename $(echo $TMUX | cut -f1 -d',')) %H:%M %d-%b-%y | Continuum status: #{continuum_status}'
set -g status-right-length 200
set -g window-status-current-format ''
set -g window-status-format ''

# System Options
set-option -g xterm-keys on

# ====================================================================
# MASTER PREFIX & GLOBAL TRAPS
# ====================================================================
set -g prefix C-t
bind C-t send-prefix

# Wipe out all default shortcuts to maintain isolated environment control
unbind -a

# ====================================================================
# GLOBAL ALONE / MODIFIER ACTIONS (Alt Shortcuts)
# ====================================================================
bind-key -n "M-R" respawn-pane -k
bind-key -n "M-G" set-option -g status
bind-key -n "M-B" new-window -c ~/
bind-key -n "M-M" choose-tree -wZ -O time
bind-key -n "M-Y" copy-mode
bind-key -n "M-:" command-prompt

# Pane Micro-Resizing Control (Arrows alternative via Home-Row Alt)
bind-key -n "M-J" resize-pane -D
bind-key -n "M-H" resize-pane -L
bind-key -n "M-K" resize-pane -U
bind-key -n "M-L" resize-pane -R

# ====================================================================
# VIM-STYLE PANE & WINDOW MANAGEMENT SUB-MENU (Alt + w)
# ====================================================================
# Press Alt+w followed by a Vim layout key
bind-key -n "M-w" switch-client -T VIM_PANE_MGMT

# Splitting Panes (Vim patterns: s for horizontal, v for vertical)
bind-key -T VIM_PANE_MGMT s split-window -v -c '#{pane_current_path}'
bind-key -T VIM_PANE_MGMT v split-window -h -c '#{pane_current_path}'

# Focus Pane Navigation (Vim patterns: h/j/k/l)
bind-key -T VIM_PANE_MGMT h select-pane -L
bind-key -T VIM_PANE_MGMT j select-pane -D
bind-key -T VIM_PANE_MGMT k select-pane -U
bind-key -T VIM_PANE_MGMT l select-pane -R

# Physical Pane Ordering Movements
bind-key -T VIM_PANE_MGMT H swap-pane -d -t '{left-of}'
bind-key -T VIM_PANE_MGMT J swap-pane -d -t '{down-of}'
bind-key -T VIM_PANE_MGMT K swap-pane -d -t '{up-of}'
bind-key -T VIM_PANE_MGMT L swap-pane -d -t '{right-of}'

# Layout Adjustments
bind-key -T VIM_PANE_MGMT = select-layout -E              # Equalize all windows
bind-key -T VIM_PANE_MGMT t select-layout even-vertical    # All columns to rows
bind-key -T VIM_PANE_MGMT i select-layout even-horizontal  # All rows to columns

# Closing & Focus Utilities
bind-key -T VIM_PANE_MGMT q kill-pane                      # Quit current pane
bind-key -T VIM_PANE_MGMT o resize-pane -Z                 # Only focus (Zoom toggle)

# ====================================================================
# CHOOSE TREE ACTIONS
# ====================================================================
bind-key -T choose-tree x if -F '#{==:#{type},session}' \
    "kill-session -t '%%' -y" \
    "kill-window -t '%%' -y"

bind-key -T choose-tree d detach-client -t "%%"

bind-key -T choose-tree r command-prompt -I "%%" \
    "if -F '#{==:#{type},session}' 'rename-session -- \"%%\"' 'rename-window -- \"%%\"'"

# ====================================================================
# COPY-MODE VI KEYBINDINGS
# ====================================================================
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-V send-keys -X rectangle-toggle

# ====================================================================
# PLUGINS & BACKEND ENVIRONMENT SETUP (TPM)
# ====================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum State Triggers
set -g @continuum-restore 'on'
set -g @continuum-auto-save 'on'
set -g @continuum-save-interval '1'

# Bootstraps TMUX Plugin Manager (Kept at the absolute end)
run '~/.tmux/plugins/tpm/tpm'

